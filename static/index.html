<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>polygraph-service</title>
<script src="vis-network.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font: 14px/1.4 sans-serif; }
  #layout { display: flex; height: 100%; }
  #sidebar { width: 380px; flex: none; padding: 14px; box-sizing: border-box;
             border-right: 1px solid #ddd; overflow-y: auto; }
  #graph { flex: 1; }
  #question { width: 100%; box-sizing: border-box; padding: 6px; font-size: 14px; }
  button { margin-top: 6px; padding: 6px 10px; cursor: pointer; }
  #answer { margin-top: 14px; white-space: pre-wrap; }
  #belege { margin-top: 10px; font-size: 12px; color: #444; }
  #belege div { margin-bottom: 4px; }
  #belege .origin { color: #999; font-size: 11px; margin-left: 12px; word-break: break-all; }
  #belege .conf-high { font-weight: 700; }
  #belege .conf-low { opacity: 0.55; }
  #legend { margin-top: 14px; font-size: 12px; }
  #legend div { margin-bottom: 3px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  #status { color: #888; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div id="layout">
  <div id="sidebar">
    <input id="question" placeholder="Frage an den Graphen..." autofocus>
    <button id="askBtn">Fragen</button>
    <button id="fullBtn">Ganzer Graph</button>
    <div id="status"></div>
    <div id="answer"></div>
    <div id="belege"></div>
    <div id="legend"></div>
  </div>
  <div id="graph"></div>
</div>
<script src="app.js"></script>
</body>
</html>
